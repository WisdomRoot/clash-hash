name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml', 'clash-hash.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Stack test
        run: stack test

      - name: Bench cache tests
        run: |
          python3 scripts/test_bench_cache.py
          python3 scripts/test_bench_integration.py
